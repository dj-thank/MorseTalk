plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

android {
    namespace 'jp.morsetalk.app'
    buildFeatures { buildConfig true }
    compileSdk 35
    defaultConfig {
        applicationId 'jp.morsetalk.app'
        minSdk 26
        targetSdk 35
        testInstrumentationRunner 'jp.morsetalk.app.SmokeInstrumentation'
        versionCode 7
        versionName '0.4.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // These are the very same modules used on Windows and in the Node tests.
    sourceSets { main { assets.srcDirs = [file('../../app')] } }
    buildTypes {
        release { minifyEnabled false }
    }
    kotlinOptions { jvmTarget = '17' }
    lint { abortOnError true }
}

dependencies { implementation 'com.google.ai.edge.litertlm:litertlm-android:0.17.0' }
