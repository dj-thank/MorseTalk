name: Signal School learning and actual tutor
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: signal-school-${{ github.ref }}
  cancel-in-progress: true
jobs:
  learning-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: node --test tests/academy.test.mjs
      - run: node tools/build_academy_preview.mjs
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: python tools/test_academy_ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Signal-School-preview-and-UI-evidence
          path: |
            dist/MorseTalk-Signal-School-Preview.html
            test-results/academy/
          retention-days: 14
  real-tutor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: {MORSETALK_AI_MODEL: 'gemma4:e2b-it-qat'}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: bash tools/start_ci_model.sh
      - name: Actual Gemma conversations and examiner in both alphabets
        run: node tools/test_academy_model.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Signal-School-actual-model-evidence
          path: test-results/academy-model/
          retention-days: 14
      - if: always()
        run: docker rm -f morsetalk-ollama || true
