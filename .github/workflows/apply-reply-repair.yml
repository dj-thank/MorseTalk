name: Apply bounded reply repair once
on:
  push:
    paths: ['.github/workflows/apply-reply-repair.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/natural-conversation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify complete repair patch and exact source preimages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,re,subprocess,urllib.request
          from pathlib import Path
          sha='29d93f90dc52466fec92b4c76734bc1d83788372'
          req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as r: packed=base64.b64decode(json.load(r)['content'])
          assert len(packed)==2772 and hashlib.sha256(packed).hexdigest()=='58856c52f92ef56cefc4a763b21aadde6418e6f6182cc194b5d27aeceb11dddf'
          dec=lzma.LZMADecompressor(memlimit=128*1024*1024)
          raw=dec.decompress(packed,max_length=10000)
          assert dec.eof and not dec.unused_data and len(raw)==6677
          assert hashlib.sha256(raw).hexdigest()=='e1c2d60c5be302057413729ed3de22bc58b1cbb50c8da797010941bc95268432'
          allowed={'app/core/conversation.mjs','app/core/fast-link.mjs','tests/conversation.test.mjs','tools/conversation_topics.mjs','tools/test_conversation_topics.py'}
          files={}
          for block in raw.decode().split('diff --git ')[1:]:
              m=re.fullmatch(r'a/(\S+) b/(\S+)',block.splitlines()[0]);assert m and m[1]==m[2] and m[1] in allowed
              name=m[1];assert name not in files
              for p in (Path(name),*Path(name).parents):assert not p.is_symlink()
              idx=re.search(r'^index ([0-9a-f]{40})\.\.([0-9a-f]{40})',block,re.M);assert idx
              assert subprocess.check_output(['git','hash-object','--',name],text=True).strip()==idx[1]
              files[name]=idx[2]
          assert set(files)==allowed
          subprocess.run(['git','apply','--unidiff-zero','--check','--index','-'],input=raw,check=True)
          subprocess.run(['git','apply','--unidiff-zero','--index','-'],input=raw,check=True)
          for name,sha in files.items():assert subprocess.check_output(['git','hash-object','--',name],text=True).strip()==sha
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','Constrain natural replies early and revise actual rejected candidates once without wire truncation'],check=True)
          subprocess.run(['git','push','origin','HEAD:feat/natural-conversation'],check=True)
          PY
