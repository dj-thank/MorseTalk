name: Apply complete natural-conversation source once
on:
  push:
    paths: ['.github/workflows/apply-conversation.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/natural-conversation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify every ordinary source preimage and the complete patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,re,subprocess,urllib.request
          from pathlib import Path
          shas=['3b05dc111f2be9f8a582cd5b52a83d168d80f936','b6d47bcecfa783aeb5ad622f687c439e1a2459ec','3d27cbe3d8ce40623db72d7ae27a0f141570383d']
          chunks=[]
          for sha in shas:
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as r: obj=json.load(r)
              chunk=base64.b64decode(obj['content'])
              assert hashlib.sha1(b'blob '+str(len(chunk)).encode()+b'\0'+chunk).hexdigest()==sha
              chunks.append(chunk)
          packed=b''.join(chunks)
          assert len(packed)==17116 and hashlib.sha256(packed).hexdigest()=='92e63c96d38d45bf2364fbe9ab3d9fcf504d20e5b3435dae78850cbdc60547f3'
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          raw=decoder.decompress(packed,max_length=100000)
          assert decoder.eof and not decoder.unused_data and len(raw)==52880
          assert hashlib.sha256(raw).hexdigest()=='c01765182b00ed8990b2eee5c8bde3cd135bc13478d18abd54aa1bf6aeb3e5fa'
          allowed={'CHANGELOG.md','README.md','android/app/build.gradle','app/ai.html','app/core/conversation.mjs','app/core/fast-link.mjs','app/core/session-tools.mjs','app/js/ai-app.mjs','app/js/conversation-ui.mjs','docs/CONVERSATION-0.5.0.md','package.json','tests/conversation.test.mjs','tools/conversation_topics.mjs','tools/test_ai_ui.py','tools/test_conversation_topics.py','tools/test_conversation_ui.py','tools/test_real_ai.py'}
          files={}
          for block in raw.decode('utf-8').split('diff --git ')[1:]:
              match=re.fullmatch(r'a/(\S+) b/(\S+)',block.splitlines()[0])
              assert match and match[1]==match[2] and match[1] in allowed
              name=match[1];assert name not in files
              for p in (Path(name),*Path(name).parents):assert not p.is_symlink()
              index=re.search(r'^index ([0-9a-f]{40})\.\.([0-9a-f]{40})',block,re.M);assert index
              if index[1]=='0'*40:assert not Path(name).exists(),name
              else:assert subprocess.check_output(['git','hash-object','--',name],text=True).strip()==index[1],name
              files[name]=index[2]
          assert set(files)==allowed
          subprocess.run(['git','apply','--unidiff-zero','--check','--index','-'],input=raw,check=True)
          subprocess.run(['git','apply','--unidiff-zero','--index','-'],input=raw,check=True)
          for name,sha in files.items():assert subprocess.check_output(['git','hash-object','--',name],text=True).strip()==sha,name
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','Add multi-topic Gemma dialogue, bounded repetition repair, human topic turns and real-model verification'],check=True)
          subprocess.run(['git','push','origin','HEAD:feat/natural-conversation'],check=True)
          print('Complete source applied. Runtime and model results must be inspected separately.')
          PY
