name: Apply explicit topic context once
on:
  push:
    paths: ['.github/workflows/apply-topic-context.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/natural-conversation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify complete patch and exact ordinary-source preimages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,re,subprocess,urllib.request
          from pathlib import Path
          sha='fec6a7f42eedba905fb1d5b9ee8c26454d80febb'
          req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as r: packed=base64.b64decode(json.load(r)['content'])
          assert len(packed)==6332 and hashlib.sha256(packed).hexdigest()=='a8ade3c1417db68fcbe9d240f41351210577068b54dc61882c300490df0135b6'
          dec=lzma.LZMADecompressor(memlimit=128*1024*1024)
          raw=dec.decompress(packed,max_length=30000)
          assert dec.eof and not dec.unused_data and len(raw)==19183
          assert hashlib.sha256(raw).hexdigest()=='79cfc243f6270ac21c3fa55dd5456f9519eaf41f49dbbac42dab5700c4d64bb7'
          allowed={'android/app/src/androidTest/java/jp/morsetalk/app/SmokeInstrumentation.java','app/core/conversation.mjs','app/core/fast-link.mjs','app/core/session-tools.mjs','app/js/ai-app.mjs','app/js/conversation-ui.mjs','docs/CONVERSATION-0.5.0.md','tests/conversation.test.mjs','tools/audio_pair.mjs','tools/conversation_topics.mjs','tools/test_ai_ui.py','tools/test_conversation_topics.py','tools/test_conversation_ui.py','tools/test_online_browser.py'}
          files={}
          for block in raw.decode().split('diff --git ')[1:]:
              m=re.fullmatch(r'a/(\S+) b/(\S+)',block.splitlines()[0]);assert m and m[1]==m[2] and m[1] in allowed
              name=m[1];assert name not in files
              for p in (Path(name),*Path(name).parents):assert not p.is_symlink()
              idx=re.search(r'^index ([0-9a-f]{40})\.\.([0-9a-f]{40})',block,re.M);assert idx
              assert subprocess.check_output(['git','hash-object','--',name],text=True).strip()==idx[1],name
              files[name]=idx[2]
          assert set(files)==allowed
          subprocess.run(['git','apply','--unidiff-zero','--check','--index','-'],input=raw,check=True)
          subprocess.run(['git','apply','--unidiff-zero','--index','-'],input=raw,check=True)
          for name,sha in files.items():assert subprocess.check_output(['git','hash-object','--',name],text=True).strip()==sha,name
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','Send initial human topic through Morse before AI replies, preserve shared context and repair unintended language drift'],check=True)
          subprocess.run(['git','push','origin','HEAD:feat/natural-conversation'],check=True)
          PY
