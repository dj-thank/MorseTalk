name: Apply navigation isolation patch once
on:
  push:
    paths: ['.github/workflows/harden-navigation.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/gemma-polish-031'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify complete patch and its source preimages before writing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,re,subprocess,urllib.request
          from pathlib import Path
          sha='a63d4f1b1f621afd617b7110d3829affd039039e'
          req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as response: obj=json.load(response)
          packed=base64.b64decode(obj['content']);assert len(packed)==4072
          assert hashlib.sha1(b'blob '+str(len(packed)).encode()+b'\0'+packed).hexdigest()==sha
          dec=lzma.LZMADecompressor(memlimit=64*1024*1024)
          raw=dec.decompress(packed,max_length=20000)
          assert dec.eof and not dec.unused_data and len(raw)==11679
          assert hashlib.sha256(raw).hexdigest()=='4f0765efb5aafedb661c8c9f1ceed8c518e1c3a16d10aab321ff774d91e043d3'
          allowed={'android/app/src/main/java/jp/morsetalk/app/MainActivity.java','android/app/src/androidTest/java/jp/morsetalk/app/SmokeInstrumentation.java','docs/POLISH-0.3.1.md'}
          files={}
          for block in raw.decode().split('diff --git ')[1:]:
              match=re.fullmatch(r'a/(\S+) b/(\S+)',block.splitlines()[0])
              assert match and match[1]==match[2] and match[1] in allowed
              path=match[1];assert path not in files and not Path(path).is_symlink()
              index=re.search(r'^index ([0-9a-f]{40})\.\.([0-9a-f]{40})',block,re.M);assert index
              assert subprocess.check_output(['git','hash-object','--',path],text=True).strip()==index[1],path
              files[path]=index[2]
          assert set(files)==allowed
          subprocess.run(['git','apply','--check','--index','-'],input=raw,check=True)
          subprocess.run(['git','apply','--index','-'],input=raw,check=True)
          for path,sha in files.items():assert subprocess.check_output(['git','hash-object','--',path],text=True).strip()==sha
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','Scope late native replies to trusted pages and repeat precise license navigation checks'],check=True)
          subprocess.run(['git','push','origin','HEAD:feat/gemma-polish-031'],check=True)
          PY
