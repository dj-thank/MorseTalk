name: Finalize verified Gemma source once
on:
  push:
    paths: ['.github/workflows/finalize-gemma.yml']
permissions:
  contents: write
jobs:
  finalize:
    if: github.ref == 'refs/heads/feat/gemma4-e2b-local'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply the complete hash-checked patch and add ordinary license and guide files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,subprocess,urllib.request
          from pathlib import Path
          sha='1b7e143d4b271060abbbe7eb5ece2112bbf90d2b'
          req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as response: obj=json.load(response)
          packed=base64.b64decode(obj['content'])
          assert len(packed)==4140 and hashlib.sha256(packed).hexdigest()=='492fe77419e1930ef11113d7ea18de470b093c09f615cf88f95616d2af0b600f'
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          raw=decoder.decompress(packed,max_length=20000)
          assert decoder.eof and not decoder.unused_data
          assert len(raw)==15210 and hashlib.sha256(raw).hexdigest()=='092f2ce76399d245be8ec7224dc37b1a755d581b43252e0ffebcb966ddd35486'
          paths={'android/app/src/androidTest/java/jp/morsetalk/app/SmokeInstrumentation.java','android/app/src/main/java/jp/morsetalk/app/MainActivity.java','app/js/ai-app.mjs','tools/test_ai_ui.py'}
          stat=subprocess.run(['git','apply','--numstat','-'],input=raw,stdout=subprocess.PIPE,check=True).stdout.decode()
          assert {line.split('\t',2)[2] for line in stat.splitlines()}==paths
          subprocess.run(['git','apply','--check','--index','-'],input=raw,check=True)
          subprocess.run(['git','apply','--index','-'],input=raw,check=True)
          licenses=Path('app/licenses');licenses.mkdir(exist_ok=True)
          (licenses/'Apache-2.0.txt').write_bytes(Path('/usr/share/common-licenses/Apache-2.0').read_bytes())
          (licenses/'MIT-MorseTalk.txt').write_bytes(Path('LICENSE').read_bytes())
          (licenses/'NOTICE.txt').write_text('''MorseTalk 0.3.0: MIT (MIT-MorseTalk.txt).
          Google AI Edge LiteRT-LM 0.17.0: Apache-2.0.
          https://github.com/google-ai-edge/LiteRT-LM/tree/v0.17.0
          Kotlin standard library / coroutines: JetBrains contributors, Apache-2.0.
          https://github.com/JetBrains/kotlin
          https://github.com/Kotlin/kotlinx.coroutines
          Full Apache license text is included. These unmodified dependencies are resolved through Gradle.
          Other upstream native dependencies retain their own terms; this is not a full source-level native dependency license audit.
          Gemma 4 weights are separately obtained under Apache-2.0 and are not bundled in this APK.
          https://developers.google.com/edge/litert-lm/models/gemma-4
          ''')
          p=Path('app/ai.html');s=p.read_text();assert '</footer>' in s;p.write_text(s.replace('</footer>',' <a href="licenses/NOTICE.txt">第三者ライセンス</a></footer>'))
          Path('docs/GEMMA4-E2B.md').write_text('''# MorseTalk 0.3.0 / Gemma 4 E2B

          Androidの既定はLiteRT-LM 0.17.0による端末内推論です。APKにランタイムを含み、モデルの重みは含みません。失敗時のクラウド・別モデル・HTTPへの自動切替はありません。
          WindowsはローカルOllama `gemma4:e2b-it-qat` が既定です。Androidのファイルとは形式・量子化が異なります。

          ## Androidで開始

          Googleの案内先から `gemma-4-E2B-it.litertlm` を取得してください。GGUFは取り込めません。
          https://developers.google.com/edge/litert-lm/models/gemma-4
          https://huggingface.co/litert-community/gemma-4-E2B-it-litert-lm

          「モデルを取り込む」で選択→CPUとAI処理許可を確認→「先に読み込む」→「AI接続テスト」の順です。
          「実AI×2 · PCM仮想経路」は実モデル2役の文章をPCM化・復号しますが、実時間の再生や物理通信ではありません。
          CPUは2スレッド、GPUは明示的に選択する実験設定です。64bit arm64-v8a / x86_64を対象とします。
          モデル約2.59GBをアプリ専用領域へコピーするため、ダウンロード済み元ファイルとコピー両方の空き容量が必要です。
          1MiBずつコピーし、失敗・中断で既存モデルを不完全なファイルに置き換えません。表示SHA-256は手動取り込みでは配布元との自動照合ではありません。
          CI用ダウンローダーはリビジョン・LFS SHA-256・サイズを検証します。アプリ削除で専用領域のモデルも消えます。

          ## 高速化と停止

          Engineをロードしたまま再利用し、履歴が完全一致してuser文が1件増えた場合だけConversationのKVキャッシュを使い回します。
          追加の思考生成・自動ツールは無効。最大96トークンと送信180UTF-8バイトの既定上限を分けて検査し、文を勝手に切りません。
          maxNumTokensを上書きせずモデル指定のキャッシュ設定を維持します。MTPは無条件に有効化していません。
          停止・画面非表示で生成と通信をキャンセルし、遅れた結果は送信しません。ネイティブ初期化を安全でない強制終了はせず、戻った時点で結果を捨てエンジンを解放します。その間の新規処理は拒否します。
          「モデルを解放」はRAM解放でありファイル削除ではありません。

          ## Windows

          Gemma4対応Ollamaへ `OLLAMA_NO_CLOUD=1` を反映し、`ollama pull gemma4:e2b-it-qat` を実行します。
          Python3.10以降で `Start-AI-Windows.cmd` を開きます。APIは127.0.0.1:11434/api/chat。Ollama用モデル約4.3GBは別途取得します。
          従来の翻訳画面は `Start-Windows.cmd` です。

          ## 2台で会話

          通信コード・セッション・速度を一致させ、A/Bを分け、B待機→A待機→Aから開始します。物理端末は120WPMから成功率を確認し、安定時のみ上げます。1200WPMは実験用です。
          通信コードとCRCは暗号化や本人認証ではありません。秘密情報や緊急用途には使わないでください。

          ## 再現方法と限界

          JDK17 / SDK35 / Gradle8.11.1 / AGP8.9.2 / Kotlin2.4.10でビルドします。LiteRT-LM0.17のKotlinメタデータに合わせ、互換性検査は無効化していません。
          `cd android && gradle assembleDebug assembleDebugAndroidTest lintDebug`
          `node --test tests/*.test.mjs`
          `python -m unittest discover -s tests -p 'test_*.py' -v`
          `docker build -t morsetalk-test . && docker run --rm morsetalk-test`
          実Gemma音声: `bash tools/start_ci_model.sh` → `python tools/test_real_ai.py`。
          Android端末内: `python tools/download_gemma4.py` → 起動済みエミュレーターで `bash tools/android_local_gemma.sh`。
          各Actionsの結果とモデル・対象コミット・証跡を確認してください。検証スクリプトの存在だけでは成功を意味しません。
          旧Qwenの測定値はGemmaの性能ではありません。数値PCM、実時間仮想音声、エミュレーター、実機の空気中通信を区別します。
          物理2台の距離・反響・雑音、GPU・Pixel9aの速度、実機ASR/TTSは未検証です。
          デバッグ署名APKです。別CI実行の署名が異なり上書きできない場合、旧版削除は履歴とモデルを消すため事前に書き出してください。ストア署名は含みません。
          ''',encoding='utf-8')
          for name in ['README.md','docs/AI-SETUP.md','docs/BUILD-ANDROID.md']:
              p=Path(name);guide='docs/GEMMA4-E2B.md' if name=='README.md' else 'GEMMA4-E2B.md'
              p.write_text('# 0.3.0 Gemma 4 E2B 更新\n\nAndroidは端末内LiteRT-LM、WindowsはOllama gemma4:e2b-it-qatです。現在の導入・ビルド手順は `'+guide+'` を参照してください。\n以下は0.2.2の過去の記録です。古いモデル・実行番号・APKハッシュをGemma版に適用しないでください。\n\n---\n\n'+p.read_text())
          p=Path('THIRD_PARTY_NOTICES.md');p.write_text(p.read_text()+'\n## 0.3.0 runtime\nAPK includes unmodified LiteRT-LM0.17.0 and Kotlin/coroutines dependencies (Apache-2.0). License text and attribution are in assets/licenses. Model weights are not bundled. Other upstream native dependencies retain their respective terms; a complete source-level native audit is not claimed.\n')
          additions=['app/licenses/Apache-2.0.txt','app/licenses/MIT-MorseTalk.txt','app/licenses/NOTICE.txt','app/ai.html','docs/GEMMA4-E2B.md','README.md','docs/AI-SETUP.md','docs/BUILD-ANDROID.md','THIRD_PARTY_NOTICES.md']
          subprocess.run(['git','add','--',*additions],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','Fix native proof module URL, cancellable import/unload UI, and document Gemma runtime with license assets'],check=True)
          subprocess.run(['git','push','origin','HEAD:feat/gemma4-e2b-local'],check=True)
          PY
