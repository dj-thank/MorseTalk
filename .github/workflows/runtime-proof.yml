name: MorseTalk runtime proof
on:
  push:
    paths:
      - '.github/workflows/runtime-proof.yml'
      - 'android/**'
      - 'app/**'
      - 'tools/android_smoke.sh'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: morsetalk-runtime-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk-and-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MORSETALK_AI_MODEL: qwen2.5:0.5b
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Provision Android SDK and sdkmanager explicitly
        uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Record source and verify prerequisites
        run: |
          mkdir -p test-results/android
          git rev-parse HEAD | tee test-results/source-commit.txt
          command -v sdkmanager
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build application and instrumentation APK
        working-directory: android
        run: gradle --no-daemon --console=plain assembleDebug assembleDebugAndroidTest
      - name: Verify APK signature and hash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk | tee test-results/android/apk-signature.txt
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee test-results/android/APK-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MorseTalk-installable-debug-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            test-results/source-commit.txt
            test-results/android/APK-SHA256.txt
            test-results/android/apk-signature.txt
          if-no-files-found: error
          retention-days: 14
      - name: Start real local model in a bounded Docker container
        run: |
          docker run -d --name morsetalk-ollama --cpus=2 --memory=3g -p 127.0.0.1:11434:11434 -e OLLAMA_NUM_PARALLEL=1 ollama/ollama:0.6.8
          for n in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/version > test-results/ollama-version.json; then break; fi
            sleep 1
          done
          timeout 600 docker exec morsetalk-ollama ollama pull "$MORSETALK_AI_MODEL"
          curl -fsS http://127.0.0.1:11434/api/tags > test-results/model-inventory.json
          docker inspect morsetalk-ollama --format '{{.Image}}' > test-results/model-container-image.txt
      - name: Prepare Android runtime verification
        run: |
          cat > /tmp/morsetalk-android-proof.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          collect() {
            adb logcat -d > test-results/android/logcat.txt 2>&1 || true
            adb exec-out run-as jp.morsetalk.app cat files/smoke-result.json > test-results/android/smoke-result.json 2>/dev/null || true
            adb exec-out run-as jp.morsetalk.app cat files/smoke-ai.png > test-results/android/smoke-ai.png 2>/dev/null || true
          }
          trap collect EXIT
          adb wait-for-device
          adb logcat -c
          adb install -r -g android/app/build/outputs/apk/debug/app-debug.apk
          adb install -r -g android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb reverse tcp:11434 tcp:11434
          adb shell am instrument -w -r -e model "$MORSETALK_AI_MODEL" jp.morsetalk.app.test/jp.morsetalk.app.SmokeInstrumentation | tee test-results/android/instrumentation.txt
          grep -q MORSETALK_SMOKE_OK test-results/android/instrumentation.txt
          ! grep -q MORSETALK_SMOKE_FAILED test-results/android/instrumentation.txt
          SH
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and test WebView, AudioWorklet, Java AI bridge, receive and stop
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          cores: 2
          ram-size: 2048M
          disable-animations: true
          script: bash /tmp/morsetalk-android-proof.sh
      - name: Android Lint
        working-directory: android
        run: gradle --no-daemon --console=plain lintDebug
      - name: Collect evidence without claiming physical-device verification
        if: always()
        run: |
          mkdir -p test-results
          docker logs morsetalk-ollama > test-results/ollama.log 2>&1 || true
          git archive --format=zip -o test-results/source-tested.zip HEAD
          printf 'Android emulator, not physical devices. Real inference only when the model and instrumentation steps pass. Physical speaker/microphone transmission remains a separate test.\n' > test-results/SCOPE.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MorseTalk-runtime-proof-evidence
          path: |
            test-results/
            android/app/build/reports/
          retention-days: 14
      - if: always()
        run: docker rm -f morsetalk-ollama || true
