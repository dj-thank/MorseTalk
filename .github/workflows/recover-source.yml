name: Recover previously prepared MorseTalk source
on:
  push:
    paths:
      - '.github/workflows/recover-source.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Restore complete files from the interrupted source upload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,subprocess,urllib.request,zipfile
          from pathlib import Path,PurePosixPath
          shas=['b9e1d046d27bb6a09e927ebe71a9665ad377fce3','7fcacfa0f4cb4b7a6dba81bf75e36f86ff756b34','78dc87dbc7549d16890739d48d58df52b0adee15','8d0b6dc4bcc8b8afb0712e8efb4f83bde1219872','b87471de45fa16892cf0bec025a6fdcba84f1efd','b505cd918e48f4d2c033ab1eda7d6cde2a9d88f1','67120287d85c132d2786ef53c7874afb8caccb99']
          root=Path('.recovery');root.mkdir(exist_ok=True)
          packed=b''
          for i,sha in enumerate(shas):
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as response: obj=json.load(response)
              part=base64.b64decode(obj['content']);assert hashlib.sha1(b'blob '+str(len(part)).encode()+b'\0'+part).hexdigest()==sha
              (root/('part-%03d'%i)).write_bytes(part);packed+=part
          dec=lzma.LZMADecompressor(memlimit=128*1024*1024)
          raw=dec.decompress(packed,max_length=2*1024*1024)
          # Upload stopped mid-stream; recover only complete JSON key/value pairs.
          text=raw.decode('utf-8',errors='ignore');decoder=json.JSONDecoder();pos=1;names=[]
          assert text.startswith('{')
          while pos<len(text):
              try:
                  name,end=decoder.raw_decode(text,pos)
                  assert text[end]==':'
                  value,end=decoder.raw_decode(text,end+1)
              except (ValueError,IndexError): break
              path=PurePosixPath(name)
              assert not path.is_absolute() and not any(p in ('..','.git','.github','.bootstrap','.recovery') for p in path.parts)
              assert '\\' not in name and ':' not in name and isinstance(value,str)
              p=Path(name);assert not p.is_symlink()
              p.parent.mkdir(parents=True,exist_ok=True);p.write_text(value,encoding='utf-8')
              if name.endswith('.sh'):p.chmod(0o755)
              names.append(name);pos=end
              if pos<len(text) and text[pos]==',':pos+=1
              else:break
          assert len(names)>30
          report={'recovered_files':names,'complete_archive':dec.eof,'decompressed_bytes':len(raw),'unrecovered_tail_preview':text[pos:pos+500],'verified_blob_shas':shas}
          (root/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          with zipfile.ZipFile(root/'recovered-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in names:z.write(name)
              z.write(root/'report.json','recovery-report.json')
          subprocess.run(['git','add','-f','--',*names],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','Restore complete source files from interrupted verified upload'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-source
          path: .recovery/
          retention-days: 7
