# Isolated experiment; do not replace the main verification workflow.
name: Separate desktop and native Android Gemma proof
on:
  push:
    branches: ['test/pc-android-native-proof']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: native-cross-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  separate-gemma-runtimes:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MORSETALK_AI_MODEL: gemma4:e2b-it-qat
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 76752ead73455265779ebcd8ef8e6752cfc13a4b
          persist-credentials: false
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          name: MorseTalk-installable-debug-APK
          run-id: 34635467512
          github-token: ${{ github.token }}
          path: .verified-apk
      - name: Use exact previously installed APK with identical app assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil,zipfile
          root=Path('.verified-apk')
          assert (root/'test-results/source-commit.txt').read_text().strip()=='a0326d39cb1dfc67a88a1b87c4b65e066c202549'
          paths={'android/app/build/outputs/apk/debug/app-debug.apk':'342de5ba24afd6ad7537a8c1be8178b7de460c44a4a36477a6b65e9a3849177f',
                 'android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk':'a6a4aedf54207c18c3c92984426507a85fa110bbbbbe1d25e5a8c678cb9afa2e'}
          for name,sha in paths.items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==sha
              p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(root/name,p)
          assets=[]
          with zipfile.ZipFile(root/'android/app/build/outputs/apk/debug/app-debug.apk') as z:
              for name in z.namelist():
                  if name.startswith('assets/') and not name.endswith('/'):
                      p=Path('app')/name[len('assets/'):]
                      assert z.read(name)==p.read_bytes(),name
                      assets.append(name)
          assert len(assets)==38
          out=Path('test-results');out.mkdir(exist_ok=True)
          (out/'apk-provenance.json').write_text(json.dumps({'source':'76752ead73455265779ebcd8ef8e6752cfc13a4b','apkBuildRun':34635467512,'apkCheckout':'a0326d39cb1dfc67a88a1b87c4b65e066c202549','verifiedSha256':paths,'matchingAppAssets':assets},indent=2))
          PY
          git rev-parse HEAD > test-results/source-commit.txt
      - name: Install test drivers and obtain actual native model
        run: |
          python -m pip install playwright==1.57.0 websockets==16.0
          python -m playwright install --with-deps chromium
          python tools/download_gemma4.py
      - name: Start separate desktop model server
        run: bash tools/start_ci_model.sh
      - name: Enable KVM and prepare explicit native cross-device test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          cat > /tmp/native-cross-proof.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          bash tools/android_local_gemma.sh
          adb reverse --list > test-results/reverse-before-native-cross.txt
          if grep -q 'tcp:11434' test-results/reverse-before-native-cross.txt; then
            echo 'Native phone must not have the HTTP inference endpoint forwarded' >&2
            exit 1
          fi
          export MORSETALK_PLAYWRIGHT_MODULE="$(python -c 'import pathlib,playwright; print(pathlib.Path(playwright.__file__).parent / "driver" / "package")')"
          export PYTHON="$(command -v python)"
          node tools/test_pc_android.cjs --local-gemma
          adb reverse --list > test-results/reverse-after-native-cross.txt
          SH
      - name: Real desktop Ollama <-> Morse relay <-> installed native LiteRT Gemma
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 6144M
          disk-size: 8192M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: bash /tmp/native-cross-proof.sh
      - name: Verify independent runtime result and preserve scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('test-results/pc-android/result.json').read_text())
          assert r['ok'] and not r['sameInferenceServer'] and len(r['cases'])==4
          assert r['usbHelperCreatedMapping'] and r['usbHelperCleanedUp']
          assert r['androidInference']=='native LiteRT Gemma 4 E2B'
          print('Verified separate Gemma runtimes: desktop and installed Android emulator; not physical hardware.')
          PY
      - name: Preserve exact source and all available evidence, including failures
        if: always()
        run: |
          mkdir -p test-results
          docker logs morsetalk-ollama > test-results/ollama.log 2>&1 || true
          git archive --format=zip -o test-results/source-tested.zip HEAD
          printf 'Linux desktop and Android API35 emulator. Separate real Gemma engines. Actual loopback/ADB Morse symbol transport, not a physical USB cable or acoustic air path. Exact APK provenance is separate from test-source commit; assets are byte-compared.\n' > test-results/SCOPE.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: separate-desktop-native-Gemma-evidence
          path: test-results/
          retention-days: 14
      - if: always()
        run: docker rm -f morsetalk-ollama || true
