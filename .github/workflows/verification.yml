name: Prepare pinned offline QR libraries
on:
  push:
    branches: ['feat/qr-online']
    paths: ['.github/workflows/verification.yml']
permissions:
  contents: read
jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Obtain fixed QR encoder and decoder without install scripts
        run: |
          set -euo pipefail
          mkdir -p /tmp/qr-deps out/app/vendor out/app/licenses
          cd /tmp/qr-deps
          npm pack --ignore-scripts --json qrcode-generator@1.4.4 jsqr@1.4.0 > npm-packs.json
          mkdir encoder decoder
          tar -xzf qrcode-generator-1.4.4.tgz -C encoder
          tar -xzf jsqr-1.4.0.tgz -C decoder
          cp encoder/package/qrcode.js "$GITHUB_WORKSPACE/out/app/vendor/qrcode.js"
          cp decoder/package/dist/jsQR.js "$GITHUB_WORKSPACE/out/app/vendor/jsQR.js"
          cp encoder/package/LICENSE "$GITHUB_WORKSPACE/out/app/licenses/qrcode-generator.txt"
          cp decoder/package/LICENSE "$GITHUB_WORKSPACE/out/app/licenses/jsQR.txt"
          cp npm-packs.json "$GITHUB_WORKSPACE/out/npm-packs.json"
          cd "$GITHUB_WORKSPACE/out"
          sha256sum app/vendor/* app/licenses/* > QR-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-offline-qr-libraries
          path: out/
          if-no-files-found: error
          retention-days: 7
