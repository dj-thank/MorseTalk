# Isolated experiment branch. Do not replace the production verification workflow.
name: Real AI reply-size experiment
on:
  push:
    branches: ['test/real-ai-size-check']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-model-default-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MORSETALK_AI_MODEL: qwen2.5:1.5b
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 12f318e1fed187ab599e7852d90d64fa50b090e5
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Use the unchanged application and real-time audio harness
        run: |
          mkdir -p test-results
          git rev-parse HEAD > test-results/source-commit.txt
          bash tools/start_ci_model.sh
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Four actual model replies over the actual audio clock
        run: python tools/test_real_ai.py
      - name: Check all observed replies fit the normal 180-byte UI budget
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('test-results/real-ai-audio.json')
          r=json.loads(p.read_text())
          sizes=[len(t['text'].encode('utf-8')) for t in r['turns']]
          result={'model':'qwen2.5:1.5b','transport_passed':r['ok'],'turn_utf8_bytes':sizes,'normal_ui_budget':180,'all_observed_replies_fit':all(n<=180 for n in sizes),'semantic_quality':'Requires human review of the actual transcript; byte size does not prove semantics.','physical_devices':False}
          Path('test-results/reply-budget.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps(result,ensure_ascii=False,indent=2))
          assert len(sizes)==4 and result['all_observed_replies_fit']
          PY
      - name: Preserve both successful and failed experimental evidence
        if: always()
        run: |
          mkdir -p test-results
          docker logs morsetalk-ollama > test-results/ollama.log 2>&1 || true
          git archive --format=zip -o test-results/source-tested.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-model-size-and-audio-evidence
          path: test-results/
          retention-days: 14
      - if: always()
        run: docker rm -f morsetalk-ollama || true
