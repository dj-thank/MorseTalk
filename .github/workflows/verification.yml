name: MorseTalk build and real verification
on:
  push:
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: morsetalk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Execute the complete core and server tests in Docker
        run: |
          mkdir -p test-results
          git rev-parse HEAD > test-results/source-commit.txt
          docker build -t morsetalk-test .
          docker run --rm morsetalk-test 2>&1 | tee test-results/container-tests.log
      - run: node scripts/build.mjs
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: In-memory AI and legacy UI regression tests
        run: |
          python tools/test_ai_ui.py
          python tools/test_ui_inmemory.py
      - name: Real browser, WAV import, fake microphone, stop and lifecycle
        run: python tools/test_ui.py
      - name: Production AudioWorklet at all four speeds using Chromium WAV capture
        run: python tools/test_fast_browser.py
      - name: Four real-time audio turns with an explicitly identified AI test double
        run: python tools/test_audio_pair.py
      - run: node tools/benchmark_fast.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-and-browser-evidence
          path: test-results/
          retention-days: 14
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Actual Windows PowerShell launcher and loopback-server smoke test
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          git rev-parse HEAD | Out-File test-results/source-commit.txt -Encoding ascii
          ./windows/smoke-test.ps1 | Tee-Object -FilePath test-results/windows-smoke.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-evidence
          path: test-results/
          retention-days: 14
  real-ai-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: {MORSETALK_AI_MODEL: 'qwen2.5:0.5b'}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Record source and start actual local model in bounded Docker container
        run: |
          mkdir -p test-results
          git rev-parse HEAD > test-results/source-commit.txt
          bash tools/start_ci_model.sh
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Real LLM A -> real-time PCM/AudioWorklet -> real LLM B, four turns
        run: python tools/test_real_ai.py
      - name: Record model logs and tested source
        if: always()
        run: |
          mkdir -p test-results
          docker logs morsetalk-ollama > test-results/ollama.log 2>&1 || true
          git archive --format=zip -o test-results/source-tested.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-ai-audio-evidence
          path: test-results/
          retention-days: 14
      - if: always()
        run: docker rm -f morsetalk-ollama || true
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: {MORSETALK_AI_MODEL: 'qwen2.5:0.5b'}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Prepare SDK and source evidence
        run: |
          mkdir -p test-results/android
          git rev-parse HEAD > test-results/source-commit.txt
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile application and instrumentation APK
        id: build
        working-directory: android
        run: gradle --no-daemon --console=plain assembleDebug assembleDebugAndroidTest
      - name: Verify debug APK signature and SHA256
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk | tee test-results/android/apk-signature.txt
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee test-results/android/APK-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MorseTalk-installable-debug-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            test-results/source-commit.txt
            test-results/android/APK-SHA256.txt
            test-results/android/apk-signature.txt
          if-no-files-found: error
          retention-days: 14
      - run: bash tools/start_ci_model.sh
      - name: Enable hosted-runner KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Installed app, WebView, actual Java AI call, virtual microphone start and stop
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          disable-animations: true
          script: bash tools/android_smoke.sh
      - name: Android Lint independently of emulator success
        if: always() && steps.build.outcome == 'success'
        working-directory: android
        run: gradle --no-daemon --console=plain lintDebug
      - name: Collect logs and explicit verification scope
        if: always()
        run: |
          mkdir -p test-results
          docker logs morsetalk-ollama > test-results/ollama.log 2>&1 || true
          printf 'Android is an emulator. The LLM inference is real. Physical speaker/microphone transmission and physical-device ASR are not tested.\n' > test-results/SCOPE.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-runtime-evidence
          path: |
            test-results/
            android/app/build/reports/
          retention-days: 14
      - if: always()
        run: docker rm -f morsetalk-ollama || true
