<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MorseTalk · Signal</title><link rel="stylesheet" href="/monitor/monitor.css"><link rel="stylesheet" href="/css/signal.css"></head>
<body><main class="deck"><header class="top"><div class="brand"><h1>MorseTalk <span>SIGNAL</span></h1></div><span id="state">準備</span><a href="/ai.html">設定</a></header>
<section class="conversation-bar"><label>この端末<select id="role"><option value="0">A</option><option value="1">B</option></select></label><label>WPM<input id="speed" type="number" min="1" step="any" value="20"></label><label>音量<input id="volume" type="range" min="0" max="100" value="70"></label><label class="topic-field">話題<input id="topic" value="AIは不確かな時どう行動すべき？" maxlength="60"></label><button id="listen" class="start-button">受信をはじめる</button><button id="start" disabled>Aから話す</button><button id="stop" disabled>停止</button></section>
<p class="connection-note">Gemma 4 · PC推論 / スピーカー ↔ マイク</p><p id="error" role="alert" hidden></p>
<section class="air"><div class="air-head"><span class="eyebrow">SIGNAL FLOW</span><span id="channel">待機</span></div><canvas id="strip" height="100"></canvas>
<section class="lanes"><article class="lane" id="lane-0"><div class="lane-head"><span class="who">A</span><h2>端末A</h2><span id="phase-0">待機</span></div><div class="awareness"><div class="cognition-heading">推論</div><div id="thought-0">入力待ち</div></div><div class="message-stage"><div class="message-heading"><span>メッセージ</span><span id="delivery-0">待機</span></div><div id="message-0" class="message-body row main"></div></div></article>
<article class="lane" id="lane-1"><div class="lane-head"><span class="who">B</span><h2>端末B</h2><span id="phase-1">待機</span></div><div class="awareness"><div class="cognition-heading">推論</div><div id="thought-1">相手の推論はこの端末では取得しません</div></div><div class="message-stage"><div class="message-heading"><span>メッセージ</span><span id="delivery-1">待機</span></div><div id="message-1" class="message-body row main"></div></div></article></section></section>
<section id="chat" aria-label="会話"></section><details hidden><summary>会話の履歴</summary><div id="log"></div></details></main><script type="module" src="/js/signal-app.mjs"></script></body></html>
